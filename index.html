<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Web climb statistics for an old climbing servers.">
    <meta name="msapplication-TileColor" content="#000000" />
    <meta name="theme-color" content="#000000" />
    <meta name="author" content="maxghz">
    <title>Super Climb Stats</title>

    <link rel="icon" type="image/png" href="/public/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/public/favicon.svg" />
    <link rel="shortcut icon" href="/public/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/public/apple-touch-icon.png" />
    <link rel="manifest" href="/public/site.webmanifest" />
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
    <script src="app/theme-init.js"></script>
</head>

<body>
<header class="logo"></header>
<div class="logoborder"></div>

<div id="container">
    <main id="main">
        <section id="panel">
            <ul class="panel-list">
                <li>An archive of statistics from recovered legacy servers for the Climb mode in Soldat.</li>
                <li>The only active server still running can be found at rzal.eu.</li>
            </ul>
            <button id="theme-toggle" title="toggle design mode"><img src="images/tables/themes.png" alt="Toggle theme"></button>
        </section>

        <div id="home-title">
            <img src="images/fonts/super-climb-stats.png" alt="Super Climb Stats">
        </div>

        <section id="content">
            <nav class="topnav">
                <form>
                    <input id="searchbox" type="text" name="q" placeholder="">
                    <input type="submit" value="Search">
                </form>

                <div class="menu">
                    <a href="index.html">Home</a>
                    <a href="caps.html">Caps</a>
                    <a href="players.html">Players</a>
                    <a href="servers.html">Servers</a>
                </div>
            </nav>

            <section class="top-players">
                <div class="section-header">
                    <img src="images/fonts/top-players.png">
                    <div class="sort-wrapper">
                        <span>Sort by:</span>
                        <div class="sort-select">
                            <button class="sort-trigger" id="serverFilterBtn" type="button">All Servers</button>
                            <div class="sort-options" id="serverDropdown">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="statsbox" id="topPlayers"></div>
            </section>

            <section class="latest-caps">
                <span class="latest-caps-heading"><img src="images/fonts/latest-caps.png"></span>
                <div class="statsbox" id="latestCaps"></div>
            </section>


            <footer class="site-footer">
                © 2026 maxghz<br>
                <a href="https://github.com/max-ghz/superclimbstats" target="_blank" rel="noopener noreferrer">Source code</a><br>
            </footer>
        </section>
    </main>
</div>

<script type="module" src="app/index.js"></script>
</body>
</html>
